[build-system]
requires = [
    "setuptools>=42",
    "wheel"
]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 160
# The code runs on AWS Glue Python shell (Python 3.9), so never emit newer-only syntax
target-version = ["py39"]

[[tool.mypy.overrides]]
module = ["untyped_package.*"]
follow_untyped_imports = true

[tool.mypy]
disable_error_code = ["import-untyped"]
ignore_missing_imports = true
